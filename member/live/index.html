<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ライブ・出演情報 | Nara Music Circle</title><link rel="stylesheet" href="../../style.css">
<style>
body{background:#fbfaf7;color:#303030}.wrap{max-width:900px;margin:auto;padding:36px 18px 70px}.badge{display:inline-block;background:#e9dfcf;padding:7px 13px;border-radius:999px;font-size:11px;letter-spacing:.14em;color:#53665b}h1{font-size:30px;margin:16px 0 8px;color:#283947}.lead{color:#666;line-height:1.8}.card{background:#fff;border:1px solid #e8e0d6;border-radius:16px;padding:18px;margin:14px 0}.meta{font-size:12px;color:#777}.memo{line-height:1.9;white-space:pre-wrap}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo-grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;cursor:pointer}.photo-more{display:block;width:100%;margin-top:10px;padding:11px 14px;border:1px solid #d8cdbd;border-radius:10px;background:#f8f4ed;color:#53665b;font-weight:700}.yt-link{display:block;margin:10px 0 14px;padding:11px 14px;border-radius:10px;background:#f8f4ed;color:#53665b;text-decoration:none;font-weight:700;text-align:center}.gallery-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;padding:58px 12px 20px;overflow:auto}.gallery-close{position:fixed;right:14px;top:14px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#333;font-size:24px;z-index:10000}.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:900px;margin:auto}.gallery-grid img{width:100%;border-radius:8px;display:block}.empty{padding:28px;text-align:center;color:#888}.error{background:#fff0ee;color:#9a4c40;padding:12px;border-radius:10px}.back{display:inline-block;margin-top:16px;color:#53665b}@media(max-width:600px){.photo-grid{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><main class="wrap"><span class="badge">LIVE & APPEARANCE</span><h1>ライブ・出演情報</h1><p class="lead">Nara Music Circleのライブや出演の記録です。</p><div id="status" class="error" style="display:none"></div><div id="events">読み込み中…</div><a class="back" href="../">← メンバー画面へ戻る</a><div id="galleryModal" class="gallery-modal" aria-hidden="true"><button class="gallery-close" onclick="closeGallery()" aria-label="閉じる">×</button><div id="galleryGrid" class="gallery-grid"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){
const SUPABASE_URL="https://rxkofbwiejzizpxmhqhq.supabase.co",KEY="sb_publishable_tBV97tu7ri1jsDp3-HZoJQ_tTtrDnBy";const client=window.supabase.createClient(SUPABASE_URL,KEY),box=document.getElementById("events"),status=document.getElementById("status");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(d){if(!d)return "開催日未定";const x=new Date(d+"T00:00:00");return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日`}
function yt(url){try{const u=new URL(url),host=u.hostname.toLowerCase();if(!host.includes("youtube.com")&&!host.includes("youtu.be"))return null;const listId=u.searchParams.get("list");if(listId)return `https://www.youtube.com/embed/videoseries?list=${encodeURIComponent(listId)}`;let id=null;if(host.includes("youtu.be"))id=u.pathname.slice(1).split("/")[0];else if(u.pathname==="/watch")id=u.searchParams.get("v");else{id=(u.pathname.match(/\/(?:embed|shorts)\/([^/?]+)/)||[])[1]}return id?`https://www.youtube.com/embed/${encodeURIComponent(id)}`:null}catch(e){return null}}
async function boot(){
 const {data:{user},error}=await client.auth.getUser();if(error||!user){location.href="../";return}
 const mr=await client.from("members").select("approved").eq("user_id",user.id).maybeSingle();if(mr.error||!mr.data?.approved){status.textContent="承認済みメンバーのみ閲覧できます。";status.style.display="block";box.innerHTML="";return}
 const [er,pr]=await Promise.all([client.from("live_events").select("id,title,event_date,start_time,location,memo,youtube_url").order("event_date",{ascending:false,nullsFirst:false}),client.from("live_event_photos").select("id,live_event_id,photo_url").order("created_at",{ascending:true})]);
 if(er.error||pr.error){box.innerHTML='<div class="error">ライブ・出演情報を読み込めませんでした。Supabaseの設定を確認してください。</div>';return}
 const events=er.data||[],photos=pr.data||[];if(!events.length){box.innerHTML='<div class="empty">まだライブ・出演情報はありません。</div>';return}
 box.innerHTML=events.map(e=>{const ps=photos.filter(p=>p.live_event_id===e.id),video=yt(e.youtube_url);return `<article class="card"><div class="meta">${fmt(e.event_date)}${e.start_time?" ・ 🕐 "+e.start_time.slice(0,5):""}${e.location?" ・ 📍 "+esc(e.location):""}</div><h2 style="color:#283947;margin:7px 0">${esc(e.title)}</h2>${ps.length?`<h3>📸 写真</h3><div class="photo-grid">${ps.slice(0,4).map(p=>`<img src="${esc(p.photo_url)}" alt="出演写真" loading="lazy" data-gallery="${esc(JSON.stringify(ps.map(x=>x.photo_url)))}">`).join("")}</div><button class="photo-more" data-gallery="${esc(JSON.stringify(ps.map(x=>x.photo_url)))}">📷 写真をすべて見る（${ps.length}枚）</button>`:""}${video?`<h3>🎥 動画</h3><a class="yt-link" href="${esc(e.youtube_url)}" target="_blank" rel="noopener">▶ YouTubeで動画・プレイリストを見る</a>`:""}${e.memo?`<h3>📝 活動メモ</h3><div class="memo">${esc(e.memo)}</div>`:""}</article>`}).join("")
}
window.openGallery=function(urls){const m=document.getElementById("galleryModal"),g=document.getElementById("galleryGrid");g.innerHTML=(urls||[]).map(u=>`<img src="${esc(u)}" alt="出演写真" loading="lazy">`).join("");m.style.display="block";m.setAttribute("aria-hidden","false");document.body.style.overflow="hidden"};
window.closeGallery=function(){const m=document.getElementById("galleryModal");m.style.display="none";m.setAttribute("aria-hidden","true");document.body.style.overflow=""};
document.getElementById("galleryModal").addEventListener("click",function(e){if(e.target===this)closeGallery()});
document.addEventListener("click",function(e){const el=e.target.closest("[data-gallery]");if(!el)return;try{openGallery(JSON.parse(el.getAttribute("data-gallery")))}catch(err){console.error(err)}});
boot();
})();
</script></body></html>
