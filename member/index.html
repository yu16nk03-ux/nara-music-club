<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NMC MEMBER | LINEログイン</title>
<link rel="stylesheet" href="../style.css">
<style>
.member-login{max-width:560px;margin:0 auto;padding:56px 20px 80px;text-align:center}
.member-badge{display:inline-block;padding:6px 12px;border-radius:999px;background:#f1e4cf;letter-spacing:.12em;font-size:12px}
.member-login h1{margin:18px 0 12px}.member-login p{line-height:1.9;color:#555}
.line-login{display:block;width:100%;margin:28px auto 14px;padding:15px 18px;border:0;border-radius:10px;background:#06c755;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.line-login:disabled{opacity:.55}.login-note{font-size:12px;color:#777}.member-status{margin-top:24px;padding:16px;border-radius:10px;background:#faf7f1;display:none;line-height:1.8}.member-status.error{background:#fff0ee}.back-link{display:inline-block;margin-top:24px}
.member-home{display:none;text-align:left;margin-top:28px}.member-card{background:#fff;border:1px solid #e8e0d6;border-radius:16px;padding:22px;margin-bottom:16px}.member-card h2{margin:0 0 12px;font-size:18px}.member-card p{margin:0;line-height:1.8}.logout{margin-top:18px;padding:12px 18px;border:1px solid #ddd;background:#fff;border-radius:10px}
.song-card{margin-top:16px;padding:15px;border:1px solid #e8e0d6;border-radius:13px;background:#faf8f4}.song-title{font-weight:800;font-size:16px}.song-artist{font-size:12px;color:#777;margin:3px 0 12px}.part-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.part-option input{position:absolute;opacity:0}.part-option label{display:block;text-align:center;padding:9px 4px;border:1px solid #ddd5ca;border-radius:9px;background:#fff;font-size:12px;cursor:pointer}.part-option input:checked+label{background:#eee4d2;border-color:#cdbb9b;font-weight:800}.hope-list{margin-top:12px;padding-top:10px;border-top:1px solid #e8e0d6}.hope-title{font-size:11px;color:#777;font-weight:700}.hope-line{font-size:12px;line-height:1.7;color:#59636a}.save-button{width:100%;margin-top:15px;padding:12px;border:0;border-radius:10px;background:#667b6d;color:#fff;font-weight:700}.save-button:disabled{opacity:.6}.deadline-note{margin-top:9px;font-size:11px;color:#8a7662}
</style>
</head>
<body>
<main class="member-login">
<span class="member-badge">NMC MEMBER</span>
<h1>メンバーページ</h1>
<p id="intro">活動予定や曲・パートの希望、活動記録などを<br>メンバー限定で確認できます。</p>
<button id="lineLogin" class="line-login" type="button">LINEでログイン</button>
<div class="login-note">初回ログイン後、運営による承認が必要です。</div>
<div id="status" class="member-status"></div>
<section id="memberHome" class="member-home">
  <div class="member-card"><h2>こんにちは、<span id="displayName">メンバー</span>さん。</h2><p>ログインできました。NMC MEMBERへようこそ。</p></div>
  <div class="member-card"><h2>次回の活動</h2><p>決まり次第お知らせします。</p></div>
  <div class="member-card">
    <h2>🎵 課題曲・パート希望</h2>
    <p>やりたい曲とパートを選んでください。複数の曲・複数のパートを選べます。ほかのメンバーと同じパートでも大丈夫です。</p>
    <div id="songList"></div>
    <div id="songStatus" class="member-status"></div>
  </div>
  <div class="member-card"><h2>活動記録</h2><p><a href="./activity/">これまでの活動を見る</a></p></div>
  <button id="logout" class="logout" type="button">ログアウト</button>
  <div id="adminLink" style="display:none;margin-top:16px;text-align:center"><a href="../admin/">⚙️ 運営管理画面</a></div>
</section>
<a class="back-link" href="../index.html">NMC公式サイトへ戻る</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const SUPABASE_URL="https://rxkofbwiejzizpxmhqhq.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY="sb_publishable_tBV97tu7ri1jsDp3-HZoJQ_tTtrDnBy";
  const REDIRECT_URL="https://yu16nk03-ux.github.io/nara-music-club/member/";
  const statusEl=document.getElementById("status");
  const loginBtn=document.getElementById("lineLogin");
  const homeEl=document.getElementById("memberHome");
  const nameEl=document.getElementById("displayName");
  const noteEl=document.querySelector(".login-note");
  function showStatus(message,error){statusEl.textContent=message;statusEl.className="member-status"+(error?" error":"");statusEl.style.display="block";}
  function showLogin(){loginBtn.style.display="block";noteEl.style.display="block";homeEl.style.display="none";}
  function showHome(name){loginBtn.style.display="none";noteEl.style.display="none";statusEl.style.display="none";nameEl.textContent=name||"メンバー";homeEl.style.display="block";}
  if(!window.supabase||!window.supabase.createClient){showStatus("ログイン機能を読み込めませんでした。ページを再読み込みしてください。",true);return;}
  const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const SONGS=[
    {id:"shishamo",title:"僕に彼女ができたんだ",artist:"SHISHAMO"},
    {id:"radwimps",title:"セプテンバーさん",artist:"RADWIMPS"},
    {id:"humpback",title:"拝啓、少年よ",artist:"Hump Back"}
  ];
  const PARTS=["ボーカル","ドラム","ベース","バッキングギター","リードギター","キーボード"];

  async function loadSongChoices(user){
    const list=document.getElementById("songList");
    const msg=document.getElementById("songStatus");
    list.innerHTML="";
    msg.style.display="none";

    const mine=await client.from("part_requests").select("song_id,part").eq("user_id",user.id);
    if(mine.error){
      msg.textContent="課題曲・パート希望のデータベース設定がまだ必要です。付属のSQLをSupabaseで実行してください。";
      msg.className="member-status error";
      msg.style.display="block";
    }
    const selected=new Set((mine.data||[]).map(x=>x.song_id+"::"+x.part));

    const everyone=await client.from("part_requests").select("song_id,part,display_name");
    const map={};
    (everyone.data||[]).forEach(x=>{
      const k=x.song_id+"::"+x.part;
      if(!map[k]) map[k]=[];
      map[k].push(x.display_name||"メンバー");
    });

    SONGS.forEach(song=>{
      const card=document.createElement("div");
      card.className="song-card";
      card.innerHTML='<div class="song-title"></div><div class="song-artist"></div><div class="part-grid"></div><div class="hope-list"><div class="hope-title">現在の希望者</div><div class="hope-lines"></div></div>';
      card.querySelector(".song-title").textContent=song.title;
      card.querySelector(".song-artist").textContent=song.artist;
      const grid=card.querySelector(".part-grid");
      const lines=card.querySelector(".hope-lines");

      PARTS.forEach((part,i)=>{
        const wrap=document.createElement("div");
        wrap.className="part-option";
        const input=document.createElement("input");
        input.type="checkbox";
        input.id="p-"+song.id+"-"+i;
        input.dataset.song=song.id;
        input.dataset.part=part;
        input.checked=selected.has(song.id+"::"+part);
        const label=document.createElement("label");
        label.htmlFor=input.id;
        label.textContent=part;
        wrap.append(input,label);
        grid.appendChild(wrap);

        const names=map[song.id+"::"+part]||[];
        if(names.length){
          const line=document.createElement("div");
          line.className="hope-line";
          line.textContent=part+"： "+names.join("、");
          lines.appendChild(line);
        }
      });
      list.appendChild(card);
    });

    const save=document.createElement("button");
    save.className="save-button";
    save.textContent="希望パートを保存する";
    list.appendChild(save);

    const note=document.createElement("div");
    note.className="deadline-note";
    note.textContent="回答は前日まで変更できます。パートは確定せず「希望者」として共有します。";
    list.appendChild(note);

    save.onclick=async()=>{
      save.disabled=true;
      save.textContent="保存しています…";
      try{
        const checked=[...document.querySelectorAll("#songList input[type=checkbox]:checked")];
        const rows=checked.map(i=>({
          user_id:user.id,
          song_id:i.dataset.song,
          part:i.dataset.part,
          display_name:nameEl.textContent
        }));
        let r=await client.from("part_requests").delete().eq("user_id",user.id);
        if(r.error) throw r.error;
        if(rows.length){
          r=await client.from("part_requests").insert(rows);
          if(r.error) throw r.error;
        }
        msg.textContent="希望パートを保存しました！🎸";
        msg.className="member-status";
        msg.style.display="block";
        await loadSongChoices(user);
      }catch(e){
        console.error(e);
        msg.textContent="保存できませんでした。Supabaseの設定を確認してください。";
        msg.className="member-status error";
        msg.style.display="block";
      }finally{
        save.disabled=false;
        save.textContent="希望パートを保存する";
      }
    };
  }

  async function checkMember(){
    const {data,error}=await client.auth.getUser();
    if(error){showLogin();return;}
    const user=data.user;
    if(!user){showLogin();return;}
    const result=await client.from("members").select("display_name,approved,is_admin").eq("user_id",user.id).maybeSingle();
    if(result.error){showStatus("ログインはできましたが、会員情報を確認できませんでした。",true);return;}
    if(!result.data){showStatus("ログインできました。現在、NMC運営で会員登録を確認しています。",false);return;}
    if(result.data.approved!==true){showStatus("現在、参加承認待ちです。運営が確認後、会員ページをご利用いただけます。",false);return;}
    showHome(result.data.display_name);
    if(result.data.is_admin===true) document.getElementById("adminLink").style.display="block";
    await loadSongChoices(user);
  }
  loginBtn.addEventListener("click",async function(){
    loginBtn.disabled=true;showStatus("LINEへ移動します…",false);
    try{
      const {error}=await client.auth.signInWithOAuth({provider:"custom:line",options:{redirectTo:REDIRECT_URL}});
      if(error){loginBtn.disabled=false;showStatus("LINEログインを開始できませんでした。",true);}
    }catch(e){loginBtn.disabled=false;showStatus("LINEログインでエラーが発生しました。",true);console.error(e);}
  });
  document.getElementById("logout").addEventListener("click",async function(){await client.auth.signOut();location.reload();});
  client.auth.onAuthStateChange(function(){setTimeout(checkMember,0);});
  checkMember();
})();
</script>
</body>
</html>
