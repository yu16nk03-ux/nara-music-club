<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NMC MEMBER | LINEログイン</title>
<link rel="stylesheet" href="../style.css">
<style>
.member-login{max-width:560px;margin:0 auto;padding:56px 20px 80px;text-align:center}
.member-badge{display:inline-block;padding:6px 12px;border-radius:999px;background:#f1e4cf;letter-spacing:.12em;font-size:12px}
.member-login h1{margin:18px 0 12px}
.member-login p{line-height:1.9;color:#555}
.line-login{display:block;width:100%;margin:28px auto 14px;padding:15px 18px;border:0;border-radius:10px;background:#06c755;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.login-note{font-size:12px;color:#777}
.member-status{margin-top:24px;padding:16px;border-radius:10px;background:#faf7f1;display:none}
.back-link{display:inline-block;margin-top:24px}
</style>
</head>
<body>
<main class="member-login">
<span class="member-badge">NMC MEMBER</span>
<h1>メンバーページ</h1>
<p>活動予定や曲・パートの希望、活動記録などを<br>メンバー限定で確認できます。</p>
<button id="lineLogin" class="line-login">LINEでログイン</button>
<div class="login-note">初回ログイン後、運営による承認が必要です。</div>
<div id="status" class="member-status"></div>
<a class="back-link" href="../index.html">NMC公式サイトへ戻る</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_PUBLISHABLE_KEY="YOUR_SUPABASE_PUBLISHABLE_KEY";
const statusEl=document.getElementById("status");
function showStatus(m){statusEl.textContent=m;statusEl.style.display="block";}
document.getElementById("lineLogin").addEventListener("click",async()=>{
 if(SUPABASE_URL.startsWith("YOUR_")||SUPABASE_PUBLISHABLE_KEY.startsWith("YOUR_")){
  showStatus("Supabaseの接続情報を設定すると、LINEログインを開始できます。"); return;
 }
 const {createClient}=window.supabase;
 const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
 const {error}=await supabase.auth.signInWithOAuth({
  provider:"custom:line",
  options:{redirectTo:window.location.origin+"/nara-music-club/member/"}
 });
 if(error)showStatus("ログインを開始できませんでした。");
});
</script>
</body>
</html>
