<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d8c5aa">
<title>NMC MEMBER｜Nara Music Club</title>
<link rel="stylesheet" href="../style.css">
<style>
.member-login-note{font-size:14px;line-height:1.9;color:#666;margin-top:14px}
.member-status{padding:16px 18px;background:#fff;border:1px solid #e6ded2;border-radius:12px;margin:20px 0}
.member-status strong{display:block;margin-bottom:6px}
#loginButton,#logoutButton{cursor:pointer;border:0}
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../"><img src="../images/logo.png" alt="Nara Music Club"></a>
  <a class="nav-member" href="../">ホームへ戻る</a>
</header>

<main>
<section class="section warm-section" style="min-height:72vh;display:grid;place-items:center">
<div class="contact-card" style="width:min(760px,100%)">
  <p class="section-kicker">NMC MEMBER</p>
  <h1 style="font-family:'Zen Old Mincho',serif;font-size:clamp(32px,7vw,54px);margin:0 0 16px">メンバー専用ページ</h1>
  <p>次回の活動日や参加確認、曲に関する情報などを、ここから確認できます。</p>

  <div id="loggedOut">
    <div class="dm-example">
      <span>メンバーの方へ</span>
      <p>LINEでログインすると、メンバー専用ページへ進めます。</p>
    </div>
    <button id="loginButton" class="button button-dark" type="button">LINEでログイン</button>
    <p class="member-login-note">※現在はLINEログインの動作確認段階です。メンバー承認・参加曲の登録などは次の段階で追加します。</p>
  </div>

  <div id="loggedIn" hidden>
    <div class="member-status">
      <strong id="welcome">ログインしています</strong>
      <span>LINEログインが確認できました。</span>
    </div>
    <div class="member-links">
      <a class="button button-dark" href="activity/">活動記録を見る</a>
      <a class="button button-outline" href="../">ホームページへ戻る</a>
      <button id="logoutButton" class="button button-outline" type="button">ログアウト</button>
    </div>
  </div>

  <p id="errorMessage" class="member-login-note" style="color:#9b3d35" hidden></p>
</div>
</section>
</main>

<footer class="footer"><span>© Nara Music Club</span></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://rxkofbwiejzizpxmhqhq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_tBV97tu7ri1jsDp3-HZoJQ_tTtrDnBy";

const { createClient } = supabase;
const client = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const loggedOut = document.getElementById("loggedOut");
const loggedIn = document.getElementById("loggedIn");
const welcome = document.getElementById("welcome");
const errorMessage = document.getElementById("errorMessage");

function showError(message) {
  errorMessage.textContent = message;
  errorMessage.hidden = false;
}

async function updateUI() {
  const { data, error } = await client.auth.getUser();
  if (error) {
    loggedOut.hidden = false;
    loggedIn.hidden = true;
    return;
  }
  const user = data.user;
  if (user) {
    loggedOut.hidden = true;
    loggedIn.hidden = false;
    const name = user.user_metadata?.name || user.user_metadata?.full_name || "メンバー";
    welcome.textContent = name + " さん、ログインしています";
  } else {
    loggedOut.hidden = false;
    loggedIn.hidden = true;
  }
}

document.getElementById("loginButton").addEventListener("click", async () => {
  errorMessage.hidden = true;
  const { error } = await client.auth.signInWithOAuth({
    provider: "custom:line",
    options: {
      redirectTo: window.location.origin + window.location.pathname
    }
  });
  if (error) showError("ログインを開始できませんでした。もう一度お試しください。");
});

document.getElementById("logoutButton").addEventListener("click", async () => {
  await client.auth.signOut();
  await updateUI();
});

client.auth.onAuthStateChange(() => updateUI());
updateUI();
</script>
</body>
</html>
