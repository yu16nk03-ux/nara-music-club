<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奈良ミュージッククラブ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>奈良ミュージッククラブ</h1>
  <p>社会人のための音楽コミュニティ</p>
</header>
<nav>
  <a href="#about">サークル紹介</a>
  <a href="#activity">活動内容</a>
  <a href="#join">参加方法</a>
  <a href="#contact">お問い合わせ</a>
</nav>
<main>
<section id="about">
  <h2>サークル紹介</h2>
  <p>
    奈良で音楽を楽しむ社会人向けサークルです。<br>
    楽器経験者も初心者も、一緒に音楽を楽しめる場所を目指しています。
  </p>
</section>
<section id="activity">
  <h2>活動内容</h2>
  <ul>
    <li>月1〜2回の音楽練習会</li>
    <li>セッション・合奏</li>
    <li>ライブ出演・交流イベント</li>
    <li>初心者向け楽器体験</li>
  </ul>
</section>
<section id="join">
  <h2>参加方法</h2>
  <p>
    音楽が好きな方なら大歓迎です！<br>
    年齢・経験問わず参加できます。
  </p>
  <button onclick="location.href='#contact'">
    参加希望はこちら
  </button>
</section>
<section id="contact">
  <h2>お問い合わせ</h2>
  <p>
    参加希望や質問はお気軽にご連絡ください。
  </p>
  <p>
    Instagram：準備中<br>
    メール：準備中
  </p>
</section>
</main>
<footer>
  <p>© 奈良ミュージッククラブ</p>
</footer>
<script src="script.js"></script>
</body>
</html>
