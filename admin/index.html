<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NMC ADMIN | 運営管理</title>
<link rel="stylesheet" href="../style.css">
<style>
body{background:#fbfaf7;color:#303030}.wrap{max-width:900px;margin:auto;padding:36px 18px 70px}
.badge{display:inline-block;background:#e9dfcf;padding:7px 13px;border-radius:999px;font-size:11px;letter-spacing:.14em;color:#53665b}
h1{font-size:30px;margin:16px 0 8px;color:#283947}.lead{color:#666;line-height:1.8}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.top a{color:#53665b}
.tabs{display:flex;gap:8px;overflow:auto;margin:24px 0 16px}.tab{white-space:nowrap;border:1px solid #ddd5ca;background:#fff;border-radius:999px;padding:10px 14px}.tab.active{background:#e9dfcf;font-weight:700}
.panel{display:none;background:#fff;border:1px solid #e8e0d6;border-radius:16px;padding:18px;margin-bottom:16px}.panel.active{display:block}
h2{font-size:20px;color:#283947;margin:0 0 8px}.note{font-size:13px;color:#777;line-height:1.7}
.card{border:1px solid #e8e0d6;border-radius:13px;padding:14px;margin:10px 0;background:#fcfbf9}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.name{font-weight:800}.meta{font-size:12px;color:#777}
button{border:0;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.approve{background:#667b6d;color:#fff}.disable{background:#f2e9df;color:#725f50}.admin{background:#eee4d2;color:#5f4e3a}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 6px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{color:#667;white-space:nowrap}
.empty{padding:24px 8px;text-align:center;color:#888}.error{background:#fff0ee;color:#9a4c40;padding:12px;border-radius:10px;margin:10px 0}
input,select{width:100%;box-sizing:border-box;border:1px solid #ddd5ca;border-radius:9px;padding:11px;background:#fff}label{font-size:12px;color:#666;display:block;margin:10px 0 5px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{margin-top:12px;background:#667b6d;color:#fff;width:100%}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}table{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><span class="badge">NMC ADMIN</span><h1>運営管理画面</h1><p class="lead">メンバー承認と課題曲・パート希望を管理できます。</p></div><a href="../member/">← MEMBERへ</a></div>
<div id="status" class="error" style="display:none"></div>

<div id="adminApp" style="display:none">
<div class="tabs">
<button class="tab active" data-tab="members">👥 メンバー承認</button>
<button class="tab" data-tab="requests">🎵 パート希望</button>
<button class="tab" data-tab="songs">🎼 課題曲管理</button>
</div>

<section id="members" class="panel active">
<h2>👥 メンバー承認</h2><p class="note">初回LINEログインした人はここで承認します。運営メンバーは複数人を管理者にできます。</p>
<div id="memberList"></div>
</section>

<section id="requests" class="panel">
<h2>🎵 パート希望一覧</h2><p class="note">パートは確定ではなく、現在の「希望者」の一覧です。同じパートに複数人いてOKです。</p>
<div id="requestList"></div>
</section>

<section id="songs" class="panel">
<h2>🎼 課題曲管理</h2><p class="note">運営だけが課題曲を追加・変更できます。まずは現在の3曲を登録しています。</p>
<form id="songForm">
<div class="form-grid"><div><label>曲名</label><input id="songTitle" required></div><div><label>アーティスト</label><input id="songArtist" required></div></div>
<button class="save" type="submit">課題曲を追加する</button>
</form>
<div id="songAdminList"></div>
</section>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const SUPABASE_URL="https://rxkofbwiejzizpxmhqhq.supabase.co";
const KEY="sb_publishable_tBV97tu7ri1jsDp3-HZoJQ_tTtrDnBy";
const client=window.supabase.createClient(SUPABASE_URL,KEY);
const status=document.getElementById("status"),app=document.getElementById("adminApp");
const parts=["ボーカル","ドラム","ベース","バッキングギター","リードギター","キーボード"];
function err(m){status.textContent=m;status.style.display="block"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function boot(){
 const {data:{user},error}=await client.auth.getUser();
 if(error||!user){err("LINEログインが必要です。NMC MEMBERからログインしてください。");return}
 const r=await client.from("members").select("display_name,approved,is_admin").eq("user_id",user.id).maybeSingle();
 if(r.error||!r.data?.approved||!r.data?.is_admin){err("このページは承認済みの運営メンバーのみ利用できます。");return}
 app.style.display="block"; await Promise.all([loadMembers(),loadRequests(),loadSongs()]);
}
async function loadMembers(){
 const box=document.getElementById("memberList"); box.innerHTML="読み込み中…";
 const r=await client.from("members").select("id,user_id,display_name,approved,is_admin,created_at").order("created_at",{ascending:true});
 if(r.error){box.innerHTML='<div class="error">メンバー一覧を取得できませんでした。</div>';return}
 if(!r.data.length){box.innerHTML='<div class="empty">まだメンバーはいません。</div>';return}
 box.innerHTML=r.data.map(m=>`<div class="card"><div class="row"><div><div class="name">${esc(m.display_name||"名前未設定")}</div><div class="meta">${m.approved?"承認済み":"承認待ち"}${m.is_admin?" ・ 運営":""}</div></div><div>
 ${!m.approved?`<button class="approve" onclick="setMember(${m.id},true)">承認する</button>`:""}
 ${m.approved?`<button class="disable" onclick="setMember(${m.id},false)">承認を外す</button>`:""}
 ${!m.is_admin?`<button class="admin" onclick="setAdmin(${m.id},true)">運営にする</button>`:""}
 </div></div></div>`).join("");
}
window.setMember=async(id,v)=>{const r=await client.from("members").update({approved:v}).eq("id",id);if(r.error)alert("更新できませんでした");else loadMembers()}
window.setAdmin=async(id,v)=>{if(!confirm("このメンバーを運営メンバーにしますか？"))return;const r=await client.from("members").update({is_admin:v}).eq("id",id);if(r.error)alert("更新できませんでした");else loadMembers()}
async function loadRequests(){
 const box=document.getElementById("requestList");box.innerHTML="読み込み中…";
 const r=await client.from("part_requests").select("display_name,song_id,part").order("song_id").order("part");
 if(r.error){box.innerHTML='<div class="error">パート希望を取得できませんでした。</div>';return}
 const songs={shishamo:["僕に彼女ができたんだ","SHISHAMO"],radwimps:["セプテンバーさん","RADWIMPS"],humpback:["拝啓、少年よ","Hump Back"]};
 const grouped={};r.data.forEach(x=>{const key=x.song_id+"|"+x.part;(grouped[key]??=[]).push(x.display_name||"メンバー")});
 box.innerHTML=Object.keys(songs).map(id=>`<div class="card"><div class="name">${songs[id][0]}</div><div class="meta">${songs[id][1]}</div><table><thead><tr><th>パート</th><th>希望者</th></tr></thead><tbody>${parts.map(p=>`<tr><td>${p}</td><td>${(grouped[id+"|"+p]||[]).map(esc).join("、")||"—"}</td></tr>`).join("")}</tbody></table></div>`).join("");
}
async function loadSongs(){
 const box=document.getElementById("songAdminList");box.innerHTML="読み込み中…";
 const r=await client.from("songs").select("id,title,artist").order("created_at",{ascending:true});
 if(r.error){box.innerHTML='<div class="error">課題曲テーブルが未設定です。付属SQLを実行してください。</div>';return}
 box.innerHTML=r.data.map(s=>`<div class="card"><div class="row"><div><div class="name">${esc(s.title)}</div><div class="meta">${esc(s.artist)}</div></div><button class="disable" onclick="deleteSong('${esc(s.id)}')">削除</button></div></div>`).join("")||'<div class="empty">課題曲はありません。</div>';
}
document.getElementById("songForm").addEventListener("submit",async e=>{
 e.preventDefault();const title=document.getElementById("songTitle").value.trim(),artist=document.getElementById("songArtist").value.trim();
 const id="song_"+Date.now();const r=await client.from("songs").insert({id,title,artist});
 if(r.error){alert("追加できませんでした");return}e.target.reset();loadSongs();
});
window.deleteSong=async id=>{if(!confirm("この課題曲を削除しますか？"))return;const r=await client.from("songs").delete().eq("id",id);if(r.error)alert("削除できませんでした");else loadSongs()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active")});
boot();
})();
</script>
</body></html>
